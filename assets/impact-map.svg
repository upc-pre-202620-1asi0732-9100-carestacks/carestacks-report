<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <rect width="1800" height="1120" fill="#F3F8F7"/>
  <rect x="28" y="24" width="1744" height="1072" rx="28" fill="#FFFFFF" stroke="#D4E5E2" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="60" y="76" font-size="34" font-weight="700" fill="#173B3F">Impact Mapping · CareConnect</text>
    <text x="60" y="111" font-size="20" fill="#557176">Trazabilidad entre objetivos SMART, actores, impactos, entregables e historias de usuario</text>

    <rect x="60" y="140" width="1680" height="65" rx="13" fill="#146C73"/>
    <g font-size="17" font-weight="700" fill="#FFFFFF">
      <text x="82" y="181">BUSINESS GOAL</text><text x="492" y="181">ACTOR / PERSONA</text><text x="732" y="181">IMPACTO</text><text x="1072" y="181">ENTREGABLE</text><text x="1492" y="181">USER STORIES</text>
    </g>

    <rect x="60" y="220" width="390" height="415" rx="16" fill="#D9F0EB" stroke="#A8D7CD"/>
    <rect x="78" y="240" width="58" height="32" rx="16" fill="#146C73"/><text x="92" y="263" font-size="17" font-weight="700" fill="#FFFFFF">BG1</text>
    <text x="82" y="306" font-size="19" font-weight="700" fill="#174F54"><tspan x="82">Alcanzar 500 cuidadores</tspan><tspan x="82" dy="28">activos que registren al</tspan><tspan x="82" dy="28">menos 3 eventos de salud</tspan><tspan x="82" dy="28">por semana durante los</tspan><tspan x="82" dy="28">primeros 6 meses.</tspan></text>
    <text x="82" y="478" font-size="16" fill="#476A6D"><tspan x="82">Adquisición, activación y uso</tspan><tspan x="82" dy="24">recurrente de la agenda.</tspan></text>

    <rect x="60" y="655" width="390" height="125" rx="16" fill="#E9E4F7" stroke="#CAC0E8"/>
    <rect x="78" y="674" width="58" height="32" rx="16" fill="#67509B"/><text x="92" y="697" font-size="17" font-weight="700" fill="#FFFFFF">BG2</text>
    <text x="151" y="688" font-size="18" font-weight="700" fill="#45366C"><tspan x="151">70 % de confirmación de</tspan><tspan x="151" dy="26">medicación en 3 meses.</tspan></text>

    <rect x="60" y="800" width="390" height="270" rx="16" fill="#F5E9D5" stroke="#E5CFA8"/>
    <rect x="78" y="820" width="58" height="32" rx="16" fill="#9A6D27"/><text x="92" y="843" font-size="17" font-weight="700" fill="#FFFFFF">BG3</text>
    <text x="82" y="886" font-size="19" font-weight="700" fill="#6B4A1D"><tspan x="82">Lograr que el 60 % de los</tspan><tspan x="82" dy="28">pacientes comparta su perfil</tspan><tspan x="82" dy="28">con al menos un cuidador</tspan><tspan x="82" dy="28">durante el primer trimestre.</tspan></text>

    <g font-size="17" fill="#203C40">
      <rect x="470" y="220" width="220" height="125" rx="14" fill="#F7FAFA" stroke="#CADBD8"/><text x="492" y="262" font-weight="700"><tspan x="492">Visitante</tspan><tspan x="492" dy="25">cuidador potencial</tspan></text>
      <rect x="470" y="365" width="220" height="125" rx="14" fill="#F7FAFA" stroke="#CADBD8"/><text x="492" y="407" font-weight="700"><tspan x="492">Valeria Huamán</tspan><tspan x="492" dy="25" font-weight="400">Cuidadora</tspan></text>
      <rect x="470" y="510" width="220" height="125" rx="14" fill="#F7FAFA" stroke="#CADBD8"/><text x="492" y="552" font-weight="700"><tspan x="492">Valeria Huamán</tspan><tspan x="492" dy="25" font-weight="400">Cuidadora</tspan></text>
      <rect x="470" y="655" width="220" height="125" rx="14" fill="#F7FAFA" stroke="#CADBD8"/><text x="492" y="697" font-weight="700"><tspan x="492">Rafael Medina</tspan><tspan x="492" dy="25" font-weight="400">Paciente</tspan></text>
      <rect x="470" y="800" width="220" height="125" rx="14" fill="#F7FAFA" stroke="#CADBD8"/><text x="492" y="842" font-weight="700"><tspan x="492">Rafael Medina</tspan><tspan x="492" dy="25" font-weight="400">Paciente</tspan></text>
      <rect x="470" y="945" width="220" height="125" rx="14" fill="#F7FAFA" stroke="#CADBD8"/><text x="492" y="987" font-weight="700"><tspan x="492">Valeria Huamán</tspan><tspan x="492" dy="25" font-weight="400">Cuidadora</tspan></text>
    </g>

    <g font-size="17" fill="#203C40">
      <rect x="710" y="220" width="320" height="125" rx="14" fill="#EDF7F5" stroke="#C5E2DC"/><text x="732" y="258"><tspan x="732">Comprende el valor de la</tspan><tspan x="732" dy="25">solución e inicia su registro.</tspan></text>
      <rect x="710" y="365" width="320" height="125" rx="14" fill="#EDF7F5" stroke="#C5E2DC"/><text x="732" y="403"><tspan x="732">Registra y coordina eventos</tspan><tspan x="732" dy="25">de salud de forma recurrente.</tspan></text>
      <rect x="710" y="510" width="320" height="125" rx="14" fill="#EDF7F5" stroke="#C5E2DC"/><text x="732" y="548"><tspan x="732">Actúa a tiempo ante alertas</tspan><tspan x="732" dy="25">e incumplimientos.</tspan></text>
      <rect x="710" y="655" width="320" height="125" rx="14" fill="#F3EFFA" stroke="#D8CFEB"/><text x="732" y="693"><tspan x="732">Confirma su medicación al</tspan><tspan x="732" dy="25">recibir un recordatorio.</tspan></text>
      <rect x="710" y="800" width="320" height="125" rx="14" fill="#FAF2E5" stroke="#EAD8BA"/><text x="732" y="838"><tspan x="732">Comparte su perfil con una</tspan><tspan x="732" dy="25">persona de confianza.</tspan></text>
      <rect x="710" y="945" width="320" height="125" rx="14" fill="#FAF2E5" stroke="#EAD8BA"/><text x="732" y="983"><tspan x="732">Consulta información y diario</tspan><tspan x="732" dy="25">del paciente con autorización.</tspan></text>
    </g>

    <g font-size="17" fill="#203C40">
      <rect x="1050" y="220" width="400" height="125" rx="14" fill="#FFFFFF" stroke="#CADBD8"/><text x="1072" y="258"><tspan x="1072">Landing Page con beneficios por segmento</tspan><tspan x="1072" dy="25">y llamado a la acción de registro.</tspan></text>
      <rect x="1050" y="365" width="400" height="125" rx="14" fill="#FFFFFF" stroke="#CADBD8"/><text x="1072" y="403"><tspan x="1072">Agenda multiplataforma para registrar,</tspan><tspan x="1072" dy="25">consultar y reprogramar eventos.</tspan></text>
      <rect x="1050" y="510" width="400" height="125" rx="14" fill="#FFFFFF" stroke="#CADBD8"/><text x="1072" y="548"><tspan x="1072">Centro de notificaciones y alertas</tspan><tspan x="1072" dy="25">de incumplimiento.</tspan></text>
      <rect x="1050" y="655" width="400" height="125" rx="14" fill="#FFFFFF" stroke="#CADBD8"/><text x="1072" y="693"><tspan x="1072">Recordatorios y confirmación simple</tspan><tspan x="1072" dy="25">de eventos de medicación.</tspan></text>
      <rect x="1050" y="800" width="400" height="125" rx="14" fill="#FFFFFF" stroke="#CADBD8"/><text x="1072" y="838"><tspan x="1072">Gestión de consentimiento para</tspan><tspan x="1072" dy="25">compartir y revocar accesos.</tspan></text>
      <rect x="1050" y="945" width="400" height="125" rx="14" fill="#FFFFFF" stroke="#CADBD8"/><text x="1072" y="983"><tspan x="1072">Perfil, documentos y diario compartidos</tspan><tspan x="1072" dy="25">en aplicación móvil y web.</tspan></text>
    </g>

    <g font-size="18" font-weight="700" fill="#146C73">
      <rect x="1470" y="220" width="270" height="125" rx="14" fill="#E5F3F1"/><text x="1492" y="273"><tspan x="1492">USL01 · USL02</tspan><tspan x="1492" dy="29">USL04</tspan></text>
      <rect x="1470" y="365" width="270" height="125" rx="14" fill="#E5F3F1"/><text x="1492" y="418"><tspan x="1492">US01 · US03</tspan><tspan x="1492" dy="29">USW01</tspan></text>
      <rect x="1470" y="510" width="270" height="125" rx="14" fill="#E5F3F1"/><text x="1492" y="563"><tspan x="1492">US05 · US06</tspan><tspan x="1492" dy="29">USW03</tspan></text>
      <rect x="1470" y="655" width="270" height="125" rx="14" fill="#EEE9F8"/><text x="1492" y="726">US02 · US04</text>
      <rect x="1470" y="800" width="270" height="125" rx="14" fill="#F8EEDA"/><text x="1492" y="871">US14 · US16</text>
      <rect x="1470" y="945" width="270" height="125" rx="14" fill="#F8EEDA"/><text x="1492" y="998"><tspan x="1492">US13 · US15</tspan><tspan x="1492" dy="29">USW02</tspan></text>
    </g>
  </g>
</svg>
